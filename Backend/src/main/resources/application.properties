spring.application.name=electricity-bill-predictor-backend

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/electricity_bill_predictor
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Validate database structure without automatically modifying it
spring.jpa.hibernate.ddl-auto=validate

# Development SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# SERVER
# =========================================================

server.port=8080

# Do not expose internal exception information
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# =========================================================
# OPENAI
# =========================================================

openai.api.key=${OPENAI_API_KEY:}

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:}
jwt.expiration-hours=24